# ChunkTicker configuration
# Apply changes without a restart with /ct reload.

# Master switch. Also changed by /ct on and /ct off.
# false = no tickets are set, the chunk list is kept.
global-enabled: true

# Ticket mode: plugin | forced | both (recommended)
#   plugin  -> addPluginChunkTicket()  (TicketType.PLUGIN, Level 31)
#   forced  -> setChunkForceLoaded()   (TicketType.FORCED, Level 31)
#   both    -> both tickets applied, most reliable for mob farms
ticket-mode: both

# Language of plugin messages: en, de, ru, es, fr, ja, zh
language: en

# Natural mob spawning in registered chunks while no player is nearby.
# Each cycle runs the vanilla NaturalSpawner for every registered chunk.
# If that fails or spawns nothing in a cycle, a Bukkit based spawner runs and uses the limits below.
force-spawning:
  enabled: true

  # How often a spawn attempt runs, in ticks. 400 = 20 seconds.
  interval-ticks: 400

  # Probability from 0.0 to 1.0 that a chunk gets a spawn attempt in a cycle.
  # 0.3 = roughly 1 in 3 cycles per chunk.
  spawn-chance: 0.3

  # Cap on the total number of hostile and passive mobs across all registered
  # chunks combined. Once reached, no more of that category spawn.
  global-hostile-cap: 15
  global-passive-cap: 12

  # Per-chunk cap. A chunk with at least this many mobs of a category is skipped.
  max-hostile-per-chunk: 3
  max-passive-per-chunk: 2

# Managed automatically, only edit while the server is stopped.
chunks: []
