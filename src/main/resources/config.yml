# ============================================================
#  ChunkTicker – Konfiguration
# ============================================================

global-enabled: true
ticket-mode: both

# Language for plugin messages.
# Available: en, de, ru, es, fr, ja, zh
language: en

force-spawning:
  enabled: true

  # How often a spawn attempt runs (in ticks). 400 = 20 seconds.
  interval-ticks: 400

  # Probability (0.0–1.0) that any single chunk gets a spawn attempt
  # each cycle. 0.3 = roughly 1 in 3 cycles per chunk, similar to
  # how vanilla spreads spawns across a player's view distance.
  spawn-chance: 0.3

  # Hard cap on the TOTAL number of hostile / passive mobs across
  # ALL registered chunks combined. Once reached, no more of that
  # category are spawned until mobs die or leave the area.
  global-hostile-cap: 15
  global-passive-cap: 12

  # Per-chunk secondary cap. Spawn is skipped for a chunk that
  # already has at least this many mobs of that category inside it.
  max-hostile-per-chunk: 3
  max-passive-per-chunk: 2

chunks: []
